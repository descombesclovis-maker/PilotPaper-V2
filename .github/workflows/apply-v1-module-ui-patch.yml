name: Apply V1 module UI patch

on:
  push:
    branches:
      - release/v1-monday
    paths:
      - scripts/apply-v1-module-ui-patch.mjs
      - .github/workflows/apply-v1-module-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1-monday
          fetch-depth: 0

      - name: Apply guarded patch
        run: node scripts/apply-v1-module-ui-patch.mjs

      - name: Commit patched interface
        run: |
          if git diff --quiet -- app/workspace-client.tsx; then
            echo "No interface change produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workspace-client.tsx
          git commit -m "Resolve PV module specifications automatically in workspace"
          git push origin HEAD:release/v1-monday
