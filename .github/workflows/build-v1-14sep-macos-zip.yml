name: Build exact PilotPaper V1 14 Sep macOS ZIP

on:
  push:
    branches:
      - release/v1-14sep-macos-zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-v1-zip:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout exact V1 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact application base
        shell: bash
        run: |
          set -euo pipefail
          BASE='ca8b8734925a575f17257121be80bf6f686f739e'
          git merge-base --is-ancestor "$BASE" HEAD
          CHANGED="$(git diff --name-only "$BASE"..HEAD | grep -v '^desktop/macos/' | grep -v '^.github/workflows/build-v1-14sep-macos-zip.yml$' || true)"
          test -z "$CHANGED"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install V1 dependencies
        run: npm ci

      - name: Assemble macOS payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop/macos/payload desktop-output-macos /tmp/pilotpaper-v1-template
          mkdir -p /tmp/pilotpaper-v1-template
          rsync -a ./ /tmp/pilotpaper-v1-template/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.dev.vars' \
            --exclude 'desktop/PilotPaperLauncher' \
            --exclude 'desktop/macos/payload' \
            --exclude 'desktop-output-macos'
          mkdir -p /tmp/pilotpaper-v1-template/runtime
          cp "$(command -v node)" /tmp/pilotpaper-v1-template/runtime/node
          chmod +x /tmp/pilotpaper-v1-template/runtime/node
          printf '%s\n' 'ca8b8734925a575f17257121be80bf6f686f739e' > /tmp/pilotpaper-v1-template/PILOTPAPER-MAC-BUILD.txt
          mkdir -p desktop/macos/payload
          mv /tmp/pilotpaper-v1-template desktop/macos/payload/app-template

      - name: Install macOS shell builder
        working-directory: desktop/macos
        run: npm install --no-save --no-package-lock electron@33.4.11 electron-builder@25.1.8

      - name: Build Intel app
        working-directory: desktop/macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dir --x64

      - name: Sign, verify and ZIP
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find desktop-output-macos -maxdepth 3 -type d -name 'PilotPaper V1.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          lipo -archs "$APP_PATH/Contents/MacOS/PilotPaper V1" | grep -q 'x86_64'
          test -f "$APP_PATH/Contents/Resources/app-template/PILOTPAPER-MAC-BUILD.txt"
          grep -q 'ca8b8734925a575f17257121be80bf6f686f739e' "$APP_PATH/Contents/Resources/app-template/PILOTPAPER-MAC-BUILD.txt"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" desktop-output-macos/PilotPaper-V1-14sept-macOS-Intel.zip
          shasum -a 256 desktop-output-macos/PilotPaper-V1-14sept-macOS-Intel.zip > desktop-output-macos/PilotPaper-V1-14sept-macOS-Intel.sha256

      - name: Publish ZIP to V1 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload pilotpaper-v1-test-latest \
            desktop-output-macos/PilotPaper-V1-14sept-macOS-Intel.zip \
            desktop-output-macos/PilotPaper-V1-14sept-macOS-Intel.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PilotPaper-V1-14sept-macOS-Intel
          path: |
            desktop-output-macos/PilotPaper-V1-14sept-macOS-Intel.zip
            desktop-output-macos/PilotPaper-V1-14sept-macOS-Intel.sha256
          retention-days: 14
          if-no-files-found: error
