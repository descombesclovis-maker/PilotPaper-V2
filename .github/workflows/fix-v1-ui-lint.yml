name: Fix V1 UI lint

on:
  push:
    branches:
      - release/v1-monday
    paths:
      - .github/workflows/fix-v1-ui-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1-monday
          fetch-depth: 0

      - name: Escape the exact JSX apostrophe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/workspace-client.tsx')
          source = path.read_text()
          old = "et sa puissance réelles ; aucune cote panneau n'est inventée."
          new = "et sa puissance réelles ; aucune cote panneau n&apos;est inventée."
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one JSX lint target, found {count}')
          path.write_text(source.replace(old, new))
          PY

      - name: Commit lint correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workspace-client.tsx
          git commit -m "Fix PV module workspace JSX lint"
          git push origin HEAD:release/v1-monday
