name: PilotPaper CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: pilotpaper-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Lint source
        run: npm run lint
