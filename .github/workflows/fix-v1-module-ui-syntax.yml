name: Fix V1 module UI syntax

on:
  push:
    branches:
      - release/v1-monday
    paths:
      - .github/workflows/fix-v1-module-ui-syntax.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1-monday
          fetch-depth: 0

      - name: Fix exact JSX handler closing token
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/workspace-client.tsx')
          source = path.read_text()
          old = '''                          setPowerKwp(resolvedModule && Number(value) > 0
                            ? String((resolvedModule.powerWp * Number(value)) / 1000)
                            : "");
                        }
                        placeholder="12"'''
          new = '''                          setPowerKwp(resolvedModule && Number(value) > 0
                            ? String((resolvedModule.powerWp * Number(value)) / 1000)
                            : "");
                        }}
                        placeholder="12"'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one malformed JSX handler, found {count}')
          path.write_text(source.replace(old, new))
          PY

      - name: Commit syntax correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workspace-client.tsx
          git commit -m "Fix PV module quantity handler syntax"
          git push origin HEAD:release/v1-monday
