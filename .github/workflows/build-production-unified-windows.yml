name: Build PilotPaper Production Unified Windows

on:
  workflow_dispatch:
  push:
    branches:
      - release/production-unified
    paths:
      - "desktop/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/build-production-unified-windows.yml"

permissions:
  contents: write

concurrency:
  group: pilotpaper-production-unified-windows
  cancel-in-progress: true

jobs:
  windows-production:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci

      - name: Build web application
        shell: pwsh
        run: npm run build

      - name: Run PilotPaper regressions
        shell: pwsh
        run: |
          cmd /c "npm test > regression-output.txt 2>&1"
          $testExit = $LASTEXITCODE
          "## PilotPaper production regression output" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "``````text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Get-Content regression-output.txt | Select-Object -Last 160 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "``````" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Get-Content regression-output.txt
          exit $testExit

      - name: Use Python for Windows icon
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows icon from PilotPaper monogram
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          from pathlib import Path
          source = Path("public/pilotpaper-monogram.png")
          target = Path("desktop/pilotpaper.ico")
          image = Image.open(source).convert("RGBA")
          image.thumbnail((256, 256), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (256, 256), (0, 0, 0, 0))
          canvas.alpha_composite(image, ((256-image.width)//2, (256-image.height)//2))
          canvas.save(target, format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Path make_icon.py -Encoding utf8
          python make_icon.py
          if (-not (Test-Path desktop/pilotpaper.ico)) { throw "PilotPaper icon was not created" }

      - name: Point launcher updater at production channel
        shell: pwsh
        run: |
          $path = "desktop/PilotPaperLauncher/Program.cs"
          $content = Get-Content $path -Raw
          $content = $content.Replace("pilotpaper-v1-test-latest", "pilotpaper-production-latest")
          $content = $content.Replace("PilotPaper-V1-Setup.exe", "PilotPaper-Production-Setup.exe")
          $content = $content.Replace("PilotPaper V1 — ChatGPT Image-2", "PilotPaper — Production")
          $content = $content.Replace("PilotPaper Image-2", "PilotPaper")
          Set-Content -Path $path -Value $content -Encoding utf8
          if ((Get-Content $path -Raw) -notmatch "pilotpaper-production-latest") { throw "Production updater channel was not applied" }

      - name: Use .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile single-instance WebView2 launcher
        shell: pwsh
        run: >-
          dotnet publish desktop/PilotPaperLauncher/PilotPaperLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Assemble production payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $PWD "desktop-stage"
          $current = Join-Path $stage "app/current"
          New-Item -ItemType Directory -Force -Path $current | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $current "runtime") | Out-Null

          $launcher = "desktop/PilotPaperLauncher/bin/Release/net8.0-windows/win-x64/publish/PilotPaper-V1.exe"
          if (-not (Test-Path $launcher)) { throw "PilotPaper-V1.exe missing" }
          Copy-Item $launcher (Join-Path $stage "PilotPaper-V1.exe") -Force
          Copy-Item "desktop/pilotpaper.ico" (Join-Path $stage "pilotpaper.ico") -Force
          Copy-Item (Get-Command node.exe).Source (Join-Path $current "runtime/node.exe") -Force
          Set-Content -Path (Join-Path $stage "PILOTPAPER-BUILD.txt") -Encoding ascii -Value "${{ github.sha }}"

          $tracked = git ls-files
          foreach ($file in $tracked) {
            if ($file -like ".github/*" -or $file -like "desktop/*" -or $file -like "tests/*" -or $file -like "geometry-engine/*") { continue }
            if ($file -like "DEMARRER-PILOTPAPER.cmd" -or $file -like "INSTALLER-PILOTPAPER.cmd" -or $file -like "INSTALLATION-WINDOWS.txt") { continue }
            $target = Join-Path $current $file
            $parent = Split-Path -Parent $target
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item $file $target -Force
          }

          robocopy node_modules (Join-Path $current "node_modules") /E /NFL /NDL /NJH /NJS /NP
          $code = $LASTEXITCODE
          if ($code -ge 8) { throw "robocopy node_modules failed with code $code" }
          $global:LASTEXITCODE = 0

          Set-Content -Path (Join-Path $stage "V1-README.txt") -Encoding utf8 -Value @"
          PilotPaper — Production unifiée
          ================================
          - Accueil production et bibliothèque de dossiers bâtiment.
          - Déclaration préalable : création complète en un clic guidé.
          - K-par-k : moteur de test/contrôle pièce par pièce conservé.
          - Paramètres société : identité visuelle et préférences d'installation.
          - Mise à jour isolée sur le canal production PilotPaper.
          - Les autres moteurs bâtiment restent verrouillés tant qu'ils ne sont pas développés.
          "@

          foreach ($required in @(
            (Join-Path $current "runtime/node.exe"),
            (Join-Path $current "node_modules/vite/bin/vite.js"),
            (Join-Path $current "vite.config.ts"),
            (Join-Path $stage "PilotPaper-V1.exe"),
            (Join-Path $stage "PILOTPAPER-BUILD.txt")
          )) { if (-not (Test-Path $required)) { throw "Production payload missing: $required" } }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build production installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "desktop\PilotPaperInstaller.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Build portable production archive
        shell: pwsh
        run: |
          $root = Join-Path $PWD "V1"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Copy-Item "desktop-stage" $root -Recurse
          Compress-Archive -Path $root -DestinationPath "PilotPaper-Production.zip" -CompressionLevel Optimal
          if (-not (Test-Path "PilotPaper-Production.zip")) { throw "Portable production archive missing" }

      - name: Publish production unified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "pilotpaper-production-latest"
          gh release delete $tag --repo $env:GITHUB_REPOSITORY -y --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          Copy-Item "desktop-output/PilotPaper-V1-Setup.exe" "PilotPaper-Production-Setup.exe" -Force
          gh release create $tag "PilotPaper-Production-Setup.exe" "PilotPaper-Production.zip" --repo $env:GITHUB_REPOSITORY --target "${{ github.sha }}" --title "PilotPaper — Production unifiée" --notes "Accueil production, création de DP complète, K-par-k conservé, paramètres agence et canal de mise à jour production isolé." --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish PilotPaper production release" }

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PilotPaper-Production-Windows
          path: |
            PilotPaper-Production-Setup.exe
            PilotPaper-Production.zip
          if-no-files-found: error
          retention-days: 14
