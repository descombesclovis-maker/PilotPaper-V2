name: V1 lockfile refresh

on:
  push:
    branches:
      - release/v1-monday
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1-monday
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Refresh lockfile from declared versions only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "PilotPaper CI"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh lockfile for patched Next.js release"
          git push origin HEAD:release/v1-monday
