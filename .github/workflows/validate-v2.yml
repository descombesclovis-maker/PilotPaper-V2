name: Validate PilotPaper V2

on:
  workflow_dispatch:
  push:
    branches:
      - release/v2
    paths:
      - "app/**"
      - "components/**"
      - "desktop/**"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/validate-v2.yml"

permissions:
  contents: read

concurrency:
  group: pilotpaper-v2-validation
  cancel-in-progress: true

jobs:
  validate-v2:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PilotPaper V2
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci

      - name: Build V2 web application
        shell: pwsh
        run: npm run build

      - name: Run PilotPaper regressions
        shell: pwsh
        run: npm test

      - name: Validate Windows migration scripts
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/seal-geometry-credential.ps1"),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "V2 credential migration script contains PowerShell syntax errors."
          }

      - name: Use .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile V2 desktop launcher
        shell: pwsh
        run: >-
          dotnet build desktop/PilotPaperLauncher/PilotPaperLauncher.csproj
          -c Release
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Confirm V1 V2 safety boundary
        shell: pwsh
        run: |
          if (-not (Test-Path "lib/opensolar/client.ts")) { throw "V2 geometry adapter missing" }
          if (-not (Test-Path "desktop/PilotPaperLauncher/PilotPaperV2Program.cs")) { throw "V2 launcher missing" }
          if (-not (Test-Path "scripts/seal-geometry-credential.ps1")) { throw "V2 protected credential migration missing" }
          if (-not (Test-Path "docs/OPENSOLAR_V2_POC.md")) { throw "V2 POC documentation missing" }
          Write-Host "PilotPaper V2 validation complete. No V1 release was modified or published."
