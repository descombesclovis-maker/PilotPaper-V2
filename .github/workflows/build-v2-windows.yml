name: Build PilotPaper V2 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - release/v2
    paths:
      - "desktop/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tw-animate-css"
      - ".github/workflows/build-v2-windows.yml"

permissions:
  contents: read

concurrency:
  group: pilotpaper-v2-windows
  cancel-in-progress: true

jobs:
  windows-v2:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - name: Checkout V2
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked dependencies
        shell: pwsh
        run: npm ci

      - name: Build web application
        shell: pwsh
        run: npm run build

      - name: Run PilotPaper regressions
        shell: pwsh
        run: npm test

      - name: Use Python for Windows icon
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          from pathlib import Path
          source = Path("public/pilotpaper-monogram.png")
          target = Path("desktop/pilotpaper.ico")
          image = Image.open(source).convert("RGBA")
          image.thumbnail((256, 256), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (256, 256), (0, 0, 0, 0))
          canvas.alpha_composite(image, ((256-image.width)//2, (256-image.height)//2))
          canvas.save(target, format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Path make_icon.py -Encoding utf8
          python make_icon.py
          if (-not (Test-Path desktop/pilotpaper.ico)) { throw "PilotPaper icon was not created" }

      - name: Use .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile V2 WebView2 launcher
        shell: pwsh
        run: >-
          dotnet publish desktop/PilotPaperLauncher/PilotPaperLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Assemble V2 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $PWD "desktop-stage-v2"
          $current = Join-Path $stage "app/current"
          New-Item -ItemType Directory -Force -Path $current | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $current "runtime") | Out-Null

          $launcher = "desktop/PilotPaperLauncher/bin/Release/net8.0-windows/win-x64/publish/PilotPaper-V2.exe"
          if (-not (Test-Path $launcher)) { throw "PilotPaper-V2.exe missing" }
          Copy-Item $launcher (Join-Path $stage "PilotPaper-V2.exe") -Force
          Copy-Item "desktop/pilotpaper.ico" (Join-Path $stage "pilotpaper.ico") -Force
          Copy-Item (Get-Command node.exe).Source (Join-Path $current "runtime/node.exe") -Force
          Set-Content -Path (Join-Path $stage "PILOTPAPER-BUILD.txt") -Encoding ascii -Value "${{ github.sha }}"

          $tracked = git ls-files
          foreach ($file in $tracked) {
            if ($file -like ".github/*" -or $file -like "desktop/*" -or $file -like "tests/*" -or $file -like "geometry-engine/*") { continue }
            if ($file -like "DEMARRER-PILOTPAPER.cmd" -or $file -like "INSTALLER-PILOTPAPER.cmd" -or $file -like "INSTALLATION-WINDOWS.txt") { continue }
            $target = Join-Path $current $file
            $parent = Split-Path -Parent $target
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item $file $target -Force
          }

          robocopy node_modules (Join-Path $current "node_modules") /E /NFL /NDL /NJH /NJS /NP
          $code = $LASTEXITCODE
          if ($code -ge 8) { throw "robocopy node_modules failed with code $code" }
          $global:LASTEXITCODE = 0

          Set-Content -Path (Join-Path $stage "V2-README.txt") -Encoding utf8 -Value @"
          PilotPaper V2 — Preview technique
          =================================
          - V1 reste séparée et intacte.
          - Moteur géométrique avancé optionnel avec fallback V1.
          - Jeton technique attendu dans le stockage protégé Windows, jamais dans le payload.
          - Cette build est destinée aux validations V2 avant publication finale.
          "@

          foreach ($required in @(
            (Join-Path $current "runtime/node.exe"),
            (Join-Path $current "node_modules/vite/bin/vite.js"),
            (Join-Path $current "vite.config.ts"),
            (Join-Path $stage "PilotPaper-V2.exe"),
            (Join-Path $stage "PILOTPAPER-BUILD.txt")
          )) { if (-not (Test-Path $required)) { throw "V2 payload missing: $required" } }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build V2 installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "desktop\PilotPaperV2Installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          if (-not (Test-Path "desktop-output-v2/PilotPaper-V2-Setup.exe")) { throw "V2 installer missing" }

      - name: Build portable V2 archive
        shell: pwsh
        run: |
          $root = Join-Path $PWD "PilotPaper-V2-Preview"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Copy-Item "desktop-stage-v2" $root -Recurse
          Compress-Archive -Path $root -DestinationPath "PilotPaper-V2-Preview.zip" -CompressionLevel Optimal
          if (-not (Test-Path "PilotPaper-V2-Preview.zip")) { throw "Portable V2 archive missing" }

      - name: Upload V2 preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PilotPaper-V2-Windows-Preview
          path: |
            desktop-output-v2/PilotPaper-V2-Setup.exe
            PilotPaper-V2-Preview.zip
          if-no-files-found: error
          retention-days: 14
