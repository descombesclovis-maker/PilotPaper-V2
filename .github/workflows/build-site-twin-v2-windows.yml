name: Build PilotPaper Site Twin V2 Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/site-twin-v2
    paths:
      - "app/**"
      - "components/**"
      - "desktop/**"
      - "geometry-engine/**"
      - "lib/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/build-site-twin-v2-windows.yml"

permissions:
  contents: write

concurrency:
  group: pilotpaper-site-twin-v2-windows
  cancel-in-progress: true

jobs:
  windows-site-twin:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Site Twin branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Use Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: geometry-engine/requirements.txt

      - name: Install web dependencies
        shell: pwsh
        run: npm ci

      - name: Build web application
        shell: pwsh
        run: npm run build

      - name: Run all regressions
        shell: pwsh
        run: npm test

      - name: Lint Site Twin source
        shell: pwsh
        run: npx eslint lib/site-twin-v2 app/api/site-twin-v2 app/api/dp-piece/route.ts

      - name: Install geometry engine dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r geometry-engine/requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "Geometry dependencies installation failed" }

      - name: Validate geometry engine modules
        shell: pwsh
        run: |
          python -m py_compile geometry-engine/app.py geometry-engine/main.py geometry-engine/registration.py geometry-engine/photo_api.py geometry-engine/photogrammetry_api.py geometry-engine/run.py
          if ($LASTEXITCODE -ne 0) { throw "Geometry Python syntax validation failed" }

      - name: Build embedded geometry engine
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile `
            --name PilotPaperGeometryEngine `
            --paths geometry-engine `
            --collect-all rasterio `
            --collect-all shapely `
            --collect-all pyproj `
            --collect-all sklearn `
            --collect-all cv2 `
            --collect-all laspy `
            --collect-all PIL `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            geometry-engine/run.py
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "dist/PilotPaperGeometryEngine.exe")) {
            throw "PilotPaperGeometryEngine.exe was not created"
          }

      - name: Smoke-test embedded geometry engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = Join-Path $PWD "geometry-smoke.out.log"
          $err = Join-Path $PWD "geometry-smoke.err.log"
          $engine = Start-Process -FilePath "dist/PilotPaperGeometryEngine.exe" -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $healthy = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/health" -TimeoutSec 2
                if ($health.ok -eq $true) {
                  if (-not ($health.capabilities -contains "geotiff-dsm")) { throw "DSM capability missing" }
                  if (-not ($health.capabilities -contains "ign-mnx-samples")) { throw "IGN MNX capability missing" }
                  $healthy = $true
                  break
                }
              } catch {}
            }
            if (-not $healthy) {
              if (Test-Path $err) { Get-Content $err -Tail 100 }
              throw "Embedded geometry engine health check failed"
            }
          } finally {
            if (-not $engine.HasExited) { Stop-Process -Id $engine.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Build Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          from pathlib import Path
          source = Path("public/pilotpaper-monogram.png")
          target = Path("desktop/pilotpaper.ico")
          image = Image.open(source).convert("RGBA")
          image.thumbnail((256, 256), Image.Resampling.LANCZOS)
          canvas = Image.new("RGBA", (256, 256), (0, 0, 0, 0))
          canvas.alpha_composite(image, ((256-image.width)//2, (256-image.height)//2))
          canvas.save(target, format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Path make_icon.py -Encoding utf8
          python make_icon.py

      - name: Use .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compile WebView2 launcher
        shell: pwsh
        run: >-
          dotnet publish desktop/PilotPaperLauncher/PilotPaperLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Assemble Site Twin payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $PWD "desktop-stage"
          $current = Join-Path $stage "app/current"
          New-Item -ItemType Directory -Force -Path $current | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $current "runtime") | Out-Null

          $launcher = "desktop/PilotPaperLauncher/bin/Release/net8.0-windows/win-x64/publish/PilotPaper-V1.exe"
          if (-not (Test-Path $launcher)) { throw "PilotPaper launcher missing" }
          Copy-Item $launcher (Join-Path $stage "PilotPaper-V1.exe") -Force
          Copy-Item "desktop/pilotpaper.ico" (Join-Path $stage "pilotpaper.ico") -Force
          Copy-Item (Get-Command node.exe).Source (Join-Path $current "runtime/node.exe") -Force
          Copy-Item "dist/PilotPaperGeometryEngine.exe" (Join-Path $current "runtime/PilotPaperGeometryEngine.exe") -Force
          Set-Content -Path (Join-Path $stage "PILOTPAPER-BUILD.txt") -Encoding ascii -Value "${{ github.sha }}"

          $tracked = git ls-files
          foreach ($file in $tracked) {
            if ($file -like ".github/*" -or $file -like "desktop/*" -or $file -like "tests/*" -or $file -like "geometry-engine/*") { continue }
            if ($file -like "DEMARRER-PILOTPAPER.cmd" -or $file -like "INSTALLER-PILOTPAPER.cmd" -or $file -like "INSTALLATION-WINDOWS.txt") { continue }
            $target = Join-Path $current $file
            $parent = Split-Path -Parent $target
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item $file $target -Force
          }

          robocopy node_modules (Join-Path $current "node_modules") /E /NFL /NDL /NJH /NJS /NP
          $code = $LASTEXITCODE
          if ($code -ge 8) { throw "robocopy node_modules failed with code $code" }
          $global:LASTEXITCODE = 0

          foreach ($required in @(
            (Join-Path $current "runtime/node.exe"),
            (Join-Path $current "runtime/PilotPaperGeometryEngine.exe"),
            (Join-Path $current "node_modules/vite/bin/vite.js"),
            (Join-Path $current "vite.config.ts"),
            (Join-Path $stage "PilotPaper-V1.exe")
          )) { if (-not (Test-Path $required)) { throw "Site Twin payload missing: $required" } }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "desktop\PilotPaperInstaller.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Copy-Item "desktop-output/PilotPaper-V1-Setup.exe" "PilotPaper-SiteTwin-V2-Setup.exe" -Force

      - name: Build portable archive
        shell: pwsh
        run: |
          $root = Join-Path $PWD "PilotPaper-SiteTwin-V2"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Copy-Item "desktop-stage" $root -Recurse
          Compress-Archive -Path $root -DestinationPath "PilotPaper-SiteTwin-V2.zip" -CompressionLevel Optimal

      - name: Publish isolated Site Twin prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "pilotpaper-site-twin-v2-latest"
          gh release delete $tag --repo $env:GITHUB_REPOSITORY -y --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create $tag "PilotPaper-SiteTwin-V2-Setup.exe" "PilotPaper-SiteTwin-V2.zip" `
            --repo $env:GITHUB_REPOSITORY `
            --target "${{ github.sha }}" `
            --title "PilotPaper Site Twin V2 — validation" `
            --notes "Build isolée Site Twin V2 : Property Lock + DSM Google + IGN LiDAR/MNX + moteur géométrique embarqué + layout déterministe + normalisation photo. TEST / NON VALIDÉ." `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish Site Twin prerelease" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PilotPaper-Site-Twin-V2-Windows
          path: |
            PilotPaper-SiteTwin-V2-Setup.exe
            PilotPaper-SiteTwin-V2.zip
          if-no-files-found: error
          retention-days: 14
