name: Build PilotPaper V1 macOS Intel

on:
  push:
    branches:
      - release/v1-macos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-v1:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Checkout V1 macOS branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install locked V1 dependencies
        run: npm ci

      - name: Run V1 regressions
        run: npm test

      - name: Build V1 web application
        run: npm run build

      - name: Assemble writable macOS payload template
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop/macos/payload desktop-output-macos /tmp/pilotpaper-v1-template
          mkdir -p /tmp/pilotpaper-v1-template
          rsync -a ./ /tmp/pilotpaper-v1-template/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.dev.vars' \
            --exclude 'desktop/PilotPaperLauncher' \
            --exclude 'desktop/macos/payload' \
            --exclude 'desktop-output-macos'
          mkdir -p /tmp/pilotpaper-v1-template/runtime
          cp "$(command -v node)" /tmp/pilotpaper-v1-template/runtime/node
          chmod +x /tmp/pilotpaper-v1-template/runtime/node
          printf '%s\n' 'd12b9be0c135ed66ba1d411df7d2a91a78738e9e' > /tmp/pilotpaper-v1-template/PILOTPAPER-MAC-BUILD.txt
          mkdir -p desktop/macos/payload
          mv /tmp/pilotpaper-v1-template desktop/macos/payload/app-template

      - name: Smoke-test bundled V1 local server
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/desktop/macos/payload/app-template"
          cd "$APP"
          OPENAI_API_KEY='sk-local-smoke-placeholder-000000000000' \
          DP_TEST_EXPORT='true' \
          DP_IMAGE_MODEL='gpt-image-2' \
          NODE_ENV='development' \
          ./runtime/node ./node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5174 --strictPort > /tmp/pilotpaper-v1-macos.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:5174/ >/dev/null; then
              echo 'PilotPaper V1 local server ready.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pilotpaper-v1-macos.log || true
          exit 1

      - name: Install macOS shell builder
        working-directory: desktop/macos
        run: npm install --no-save --no-package-lock electron@33.4.11 electron-builder@25.1.8

      - name: Build Intel macOS application bundle
        working-directory: desktop/macos
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dir --x64

      - name: Ad-hoc sign application bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find desktop-output-macos -maxdepth 3 -type d -name 'PilotPaper V1.app' -print -quit)"
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          echo "Architectures: $(lipo -archs "$APP_PATH/Contents/MacOS/PilotPaper V1")"
          lipo -archs "$APP_PATH/Contents/MacOS/PilotPaper V1" | grep -q 'x86_64'

      - name: Build PilotPaper V1 DMG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf desktop-output-macos/dmg-root
          mkdir -p desktop-output-macos/dmg-root
          ditto "$APP_PATH" "desktop-output-macos/dmg-root/PilotPaper V1.app"
          ln -s /Applications desktop-output-macos/dmg-root/Applications
          hdiutil create \
            -volname 'PilotPaper V1' \
            -srcfolder desktop-output-macos/dmg-root \
            -ov \
            -format UDZO \
            desktop-output-macos/PilotPaper-V1-macOS-Intel.dmg
          shasum -a 256 desktop-output-macos/PilotPaper-V1-macOS-Intel.dmg

      - name: Upload macOS V1 DMG
        uses: actions/upload-artifact@v4
        with:
          name: PilotPaper-V1-macOS-Intel
          path: desktop-output-macos/PilotPaper-V1-macOS-Intel.dmg
          retention-days: 14
          if-no-files-found: error
